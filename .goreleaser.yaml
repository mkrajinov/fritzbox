# Release: push a tag (git tag v0.1.0 && git push origin v0.1.0); .github/workflows/release.yml
# builds the archives, creates the GitHub release and updates the Homebrew tap.
# Local dry run: goreleaser release --snapshot --clean
version: 2
project_name: fritzbox
# Always GitHub, even when GITLAB_TOKEN is set in the environment.
force_token: github

before:
  hooks:
    - go mod tidy
    - ./scripts/completions.sh

builds:
  - main: ./cmd/fritzbox
    binary: fritzbox
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/mkrajinov/fritzbox/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - completions/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

# A formula (plain `brew install`, macOS and Linux). It installs the prebuilt binary from the
# release, links fb to fritzbox and installs the completions for both names.
# GoReleaser marks brews as deprecated in favour of casks, so `goreleaser check` reports it;
# it keeps working throughout v2, which release.yml pins.
brews:
  - name: fritzbox
    homepage: https://github.com/mkrajinov/fritzbox
    description: CLI and TUI to manage AVM FRITZ!Box routers
    directory: Formula
    install: |
      bin.install "fritzbox"
      bin.install_symlink "fritzbox" => "fb"
      bash_completion.install "completions/fritzbox.bash" => "fritzbox"
      bash_completion.install "completions/fb.bash" => "fb"
      zsh_completion.install "completions/_fritzbox"
      fish_completion.install "completions/fritzbox.fish", "completions/fb.fish"
    test: |
      assert_match version.to_s, shell_output("#{bin}/fritzbox --version")
      assert_match version.to_s, shell_output("#{bin}/fb --version")
    commit_author:
      name: Muhamed Krajinovic
      email: muhamed.krajinovic@gmail.com
    commit_msg_template: "fritzbox {{ .Tag }}"
    repository:
      owner: mkrajinov
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
