name: release
# Every push to main checks the Conventional Commits since the last tag
# (scripts/next-version.sh). feat/fix/perf/breaking commits create the next v* tag and
# release it; anything else (docs, ci, chore, …) releases nothing.
# Pushing a v* tag by hand also releases it. Tags pushed by this workflow do not start
# it again (GitHub never triggers workflows from GITHUB_TOKEN pushes).
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: write # push the tag, create the GitHub release
concurrency:
  group: release # one at a time, so two quick pushes can't compute the same tag
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for the version and the changelog
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            tag=$(./scripts/next-version.sh)
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "next version: ${tag:-none, no feat/fix/perf commits since the last tag}"
          fi
      - if: steps.version.outputs.tag != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: steps.version.outputs.tag != ''
        run: go test -race ./...
      - name: Tag
        if: steps.version.outputs.new == 'true' && steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "fritzbox $TAG"
          git push origin "$TAG"
      - if: steps.version.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token with "Contents: read and write" on mkrajinov/homebrew-tap only.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
